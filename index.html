<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="hart.png">
    <title>Awareness Check</title>
    <style>
        /* 1. IMPORTING LOVERA FONT */
        @font-face {
            font-family: 'Lovera';
            src: url('lovera.woff2') format('woff2'); 
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Changed to min-height for mobile stability */
            background-color: #f3c2e6;
            font-family: 'Lovera', 'Georgia', serif; 
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
            padding: 20px 0;
        }

        .gif-container {
            width: 80vw; /* Responsive width */
            max-width: 280px;
            height: 80vw; /* Keep it square */
            max-height: 280px;
            margin: 0 auto 25px auto;
            border-radius: 12px;
            overflow: hidden;
            background-color: #eee;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #ff1a4d;
            font-size: clamp(1.8rem, 8vw, 2.5rem); /* Scales between 1.8rem and 2.5rem based on screen */
            margin-bottom: 45px;
            font-weight: normal;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap; /* Allows buttons to stack if the screen is tiny */
        }

        .btn-link {
            text-decoration: none;
            background-color: #f78ae0;
            color: white;
            width: 140px; /* Slightly smaller for mobile safety */
            height: 60px;
            font-family: 'Lovera', 'Georgia', serif;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* NEON RED HOVER */
        .btn-link:hover {
            background-color: #ff003c; 
            color: #fff;
            box-shadow: 
                0 0 10px #ff003c, 
                0 0 25px #ff003c, 
                0 0 50px #ff003c;
            transform: scale(1.05);
        }

        /* Mobile specific tweak */
        @media (max-width: 380px) {
            .button-group {
                gap: 15px;
            }
            .btn-link {
                width: 120px;
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gif-container">
            <img src="https://media4.giphy.com/media/v1.Y2lkPTZjMDliOTUyMmdiOHowYzIwcWlpMzFvenNjaGRhcDJmb3N5eXhjazQyeXF6eWRybCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/d37mEpcaGP3pudPoho/200.gif" alt="Visual content">
        </div>

        <h1>Are you aware of my feelings?</h1>

        <div class="button-group">
            <a href="firstyes.html" class="btn-link">Yes</a>
            <a href="firstno.html" class="btn-link">No</a>
        </div>
    </div>

</body>
</html>
