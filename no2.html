<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Are u sure??</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">

    <style>
        @font-face {
            font-family: 'Lovera';
            src: url('lovera.woff2') format('woff2'); 
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3c2e6;
            font-family: 'Lovera', 'Georgia', serif; 
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 600px;
            padding: 20px 0;
        }

        .gif-container {
            width: 70vw;
            max-width: 280px;
            height: 70vw;
            max-height: 280px;
            margin: 0 auto 25px auto;
            border-radius: 20px;
            overflow: hidden;
            background-color: #fff;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #ff1a4d;
            font-size: clamp(1.5rem, 6vw, 2.2rem);
            margin: 10px 0 45px 0;
            font-weight: normal;
            line-height: 1.4;
        }

        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 4vw, 30px);
            flex-wrap: wrap; /* Essential for mobile so buttons don't clip */
        }

        /* FIXED BUTTON STYLING - RESPONSIVE */
        .btn-link, .btn-submit {
            text-decoration: none;
            background-color: #f78ae0;
            color: white;
            /* Using clamp to scale size down on phones but keep them identical */
            width: clamp(130px, 38vw, 180px);
            height: clamp(55px, 15vw, 70px);
            font-family: 'Lovera', 'Georgia', serif;
            font-size: clamp(1.2rem, 5vw, 2rem);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            padding: 0;
            flex-shrink: 0; 
            border-radius: 0; 
        }

        .btn-link:hover, .btn-submit:hover {
            background-color: #ff003c; 
            color: #fff;
            box-shadow: 0 0 15px #ff003c, 0 0 30px #ff003c, 0 0 60px #ff003c;
            transform: scale(1.05);
        }

        form {
            margin: 0;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gif-container">
            <img src="https://i.pinimg.com/originals/87/d5/88/87d588d92e1b4decd302a96c265d7a39.gif" alt="Asking out">
        </div>

        <h1>Are you sure. Do you like me back</h1>
        
        <!--Make sure you have your own formspree account and form created paste the code here 
        for example: action="https://formspree.io/f/xbdneggarz

        ALSO, if you published it as a site make sure to change the site name below + desired
        directory. example : value="https://confessionz.page().)gd/date.html
        -->

        <div class="button-group">
            <form action="https://formspree.io/f/xbdzrzwy" method="POST">
                <input type="hidden" name="Message" value="She clicked YES! She likes you back romantically after a no.">
                <input type="hidden" name="_subject" value="Final Response: YES!">
                <input type="hidden" name="_next" value="https://confessionz.page.gd/date.html">
                
                <button type="submit" class="btn-submit">Yes</button>
            </form>

            <a href="no3.html" class="btn-link">No</a>
        </div>
    </div>

</body>
</html>
