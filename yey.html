<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's go out together</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">

    <style>
        @font-face {
            font-family: 'Lovera';

            align-items: center;

            background-color: #f3c2e6;

        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 600px;
            padding: 20px 0;
        }

        .gif-container {
            width: 75vw;
            max-width: 280px;
            height: 75vw;
            max-height: 280px;
            margin: 0 auto 25px auto;
            border-radius: 20px;
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .gif-container img {
            width: 100%;    
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #ff1a4d;
            font-size: clamp(1.4rem, 6vw, 2.2rem);
            margin: 10px 0 45px 0;
            font-weight: normal;
            line-height: 1.4;
        }
    </style>
</head>
<body>

        <div class="gif-container">
