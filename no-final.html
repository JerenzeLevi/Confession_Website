<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I understand</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">

    <style>
        @font-face {
            font-family: 'Lovera';
            src: url('lovera.woff2') format('woff2'); 
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3c2e6;
            font-family: 'Lovera', 'Georgia', serif; 
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 600px;
            padding: 40px 0; /* Extra padding for scrolling on small phones */
        }

        .gif-container {
            width: 70vw;
            max-width: 280px;
            height: 70vw;
            max-height: 280px;
            margin: 0 auto 25px auto;
            border-radius: 20px;
            overflow: hidden;
            background-color: #fff;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #ff1a4d;
            /* Fluid font size so the long apology doesn't break the layout */
            font-size: clamp(1.1rem, 5vw, 1.8rem); 
            margin: 15px 0;
            font-weight: normal;
            line-height: 1.5;
            padding: 0 10px;
        }

        /* The "I like you" section can be slightly bigger for emphasis */
        .emphasis {
            font-size: clamp(1.5rem, 7vw, 2.2rem);
            line-height: 1.2;
            margin: 25px 0;
        }

        .small-apology {
            font-size: clamp(1rem, 4vw, 1.4rem);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gif-container">
            <img src="https://i.pinimg.com/originals/36/ec/cb/36eccb15e0dab9575783d0143e335287.gif" alt="Reaction">
        </div>

        <h1>I do apologize if you believe that you were forced to say yes. I respect your decision and I will bless you happiness. It hurts but I do hope I'll manage. I'm sorry! Thank you!</h1>
        
        <h1 class="emphasis">I like you!<br>I like you!<br>I like you!</h1>
        
        <h1 class="small-apology">I'm sorry if I was such a mean and forceful to you.</h1>
    </div>

</body>
</html>
