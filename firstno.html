<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sure?</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💔</text></svg>">

    <style>
        /* 2. LOVERA FONT IMPORT */
        @font-face {
            font-family: 'Lovera';
            src: url('lovera.woff2') format('woff2'); 
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Changed to min-height for better mobile scroll handling */
            background-color: #f3c2e6;
            font-family: 'Lovera', 'Georgia', serif; 
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
            padding: 20px 0;
        }

        .gif-container {
            width: 75vw; /* Responsive width */
            max-width: 280px;
            height: 75vw; /* Keep it square */
            max-height: 280px;
            margin: 0 auto 25px auto;
            border-radius: 20px;
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #ff1a4d;
            font-size: clamp(1.8rem, 10vw, 2.8rem); /* Fluid font size for mobile */
            margin: 10px 0 40px 0;
            font-weight: normal;
            line-height: 1.2;
        }

        .btn-link {
            text-decoration: none;
            background-color: #f78ae0;
            color: white;
            padding: 15px 30px;
            display: inline-block;
            font-family: 'Lovera', 'Georgia', serif;
            font-size: clamp(1.4rem, 6vw, 2.2rem); /* Responsive button text */
            transition: all 0.3s ease;
            cursor: pointer;
            box-sizing: border-box; /* Ensures padding doesn't break width */
        }

        /* NEON RED HOVER */
        .btn-link:hover {
            background-color: #ff003c; 
            color: #fff;
            box-shadow: 
                0 0 15px #ff003c, 
                0 0 30px #ff003c, 
                0 0 60px #ff003c;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gif-container">
            <img src="https://wanabrar.wordpress.com/wp-content/uploads/2015/05/410.gif" alt="Confession Reaction">
        </div>

        <h1>I Like you<br>romantically!</h1>

        <a href="index.html" class="btn-link">Oh I see</a>
    </div>

</body>
</html>
